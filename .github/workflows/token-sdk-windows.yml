# token-sdk-windows: «eID Token Test» for Windows and `eid-token-check.exe`.
#
#   unit tests — windows/tests/EidTokenTest.Tests (fixtures generated in the tests; no network, no token)
#   publish    — the WinUI 3 app (self-contained, x64) and the command-line tool (self-contained, win-x64)
#   ui smoke   — the published app from a clean folder, checked through UI Automation; XAML resources in the package
#   artifact   — eid-token-test-windows-x64 (holds eid-token-test-windows-x64.zip):
#                  eid-token-test-windows-x64/
#                    eid-token-test.exe + .NET / Windows App SDK runtime, opensc\{opensc-pkcs11.dll, COPYING, OPENSSL-LICENSE.txt}
#                    eid-token-check\{eid-token-check.exe + .NET runtime, opensc-pkcs11.dll, COPYING, OPENSSL-LICENSE.txt}
#                    README.md, README-windows.md, LICENSE, trust\
#
# Reusable: called by ci.yml (every pull request, behind the `gate` check) and release.yml (manual release from main) —
# one set of build steps for both. `ref` = what to check out (empty: the triggering commit).
#
# Runner: release: true → always the GitHub-hosted image "windows-latest" (release artifacts never come from a
# self-hosted runner); otherwise `vars.EID_WINDOWS_RUNNER` (JSON), unset → "windows-latest". .NET 10 SDK pinned by
# windows/global.json (latest feature band). Not signed. No secrets.
name: token-sdk-windows

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: ${{ inputs.release && 'windows-latest' || fromJSON(vars.EID_WINDOWS_RUNNER || '"windows-latest"') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: windows
    env:
      # windows/third_party/opensc/README.md (OpenSC 0.26.1 x64 release DLL).
      OPENSC_PKCS11_SHA256: 6C1EB3705A477FBEC73CF007B6F868C77CB8A58B902FAB9F6D884570C9C4E68E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - run: dotnet --version
      - name: unit tests
        run: |
          dotnet test tests/EidTokenTest.Tests/EidTokenTest.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed (exit $LASTEXITCODE)" }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-sdk-windows-test-results
          path: windows/tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: publish app (self-contained, x64)
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'eid-token-test'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish src/EidTokenTest.App/EidTokenTest.App.csproj -c Release -p:Platform=x64 -p:DebugType=none -p:DebugSymbols=false -o $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish (app) failed (exit $LASTEXITCODE)" }
      - name: publish eid-token-check (self-contained, win-x64)
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'eid-token-test\eid-token-check'
          dotnet publish src/EidTokenTest.Cli/EidTokenTest.Cli.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o $cli
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish (cli) failed (exit $LASTEXITCODE)" }
          # Debug symbols a referenced project or package still left behind are not shipped.
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'eid-token-test') -Recurse -File -Filter *.pdb | ForEach-Object {
            Write-Host "not shipped: $($_.FullName)"
            Remove-Item $_.FullName
          }
      # No token is touched: help, a usage error (exit 2) and a module that does not exist (exit 3).
      - name: smoke test eid-token-check
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'eid-token-test\eid-token-check\eid-token-check.exe'
          & $exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "--help exit $LASTEXITCODE" }
          & $exe --module (Join-Path (Split-Path $exe) 'opensc-pkcs11.dll') --login --json | Out-Host
          if ($LASTEXITCODE -ne 2) { throw "usage error: exit $LASTEXITCODE (2 expected)" }
          & $exe --module (Join-Path $env:RUNNER_TEMP 'missing.dll') --json | Out-Host
          if ($LASTEXITCODE -ne 3) { throw "missing module: exit $LASTEXITCODE (3 expected)" }
          $global:LASTEXITCODE = 0
      - name: check the package
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'eid-token-test'
          if (-not (Test-Path (Join-Path $out 'eid-token-test.exe'))) { throw "missing in package: eid-token-test.exe" }
          foreach ($f in 'eid-token-test.exe', 'opensc\opensc-pkcs11.dll', 'opensc\COPYING', 'opensc\OPENSSL-LICENSE.txt',
                         'eid-token-check\eid-token-check.exe', 'eid-token-check\opensc-pkcs11.dll', 'eid-token-check\COPYING',
                         'eid-token-check\OPENSSL-LICENSE.txt') {
            if (-not (Test-Path (Join-Path $out $f))) { throw "missing in package: $f" }
          }
          # READ-ONLY: no tool that writes to a token, no OpenSC profile. No debug symbols (*.pdb) in the package.
          $forbidden = Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -in @('pkcs15-init.exe', 'pkcs15-tool.exe', 'pkcs11-tool.exe', 'opensc.dll') -or $_.Name -like '*label*.exe' -or $_.Extension -in @('.profile', '.pdb') }
          if ($forbidden) { throw ("forbidden files in package: " + ($forbidden.FullName -join ', ')) }
          foreach ($dll in 'opensc\opensc-pkcs11.dll', 'eid-token-check\opensc-pkcs11.dll') {
            $hash = (Get-FileHash (Join-Path $out $dll) -Algorithm SHA256).Hash
            if ($hash -ne $env:OPENSC_PKCS11_SHA256) { throw "$dll SHA-256 mismatch: $hash" }
          }
          Copy-Item ..\README.md (Join-Path $out 'README.md')
          Copy-Item README.md (Join-Path $out 'README-windows.md')
          Copy-Item ..\LICENSE (Join-Path $out 'LICENSE')
          Copy-Item ..\trust (Join-Path $out 'trust') -Recurse
          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem (Join-Path $out 'eid-token-check') -File -Filter 'eid-token-check*' | Select-Object Name, Length | Format-Table -AutoSize
      # The PUBLISHED app from a clean folder: main window, "main page loaded" in its log, and via UI Automation the
      # three section headings, «Дахин унших» and the empty state «Токен олдсонгүй» (windows/scripts/ui-smoke.ps1).
      - name: UI smoke test (published app)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ui-smoke.ps1 `
            -AppDir (Join-Path $env:RUNNER_TEMP 'eid-token-test') -OutDir (Join-Path $env:RUNNER_TEMP 'ui-smoke-evidence')
          if ($LASTEXITCODE -ne 0) { throw "UI smoke test failed (exit $LASTEXITCODE)" }
      # Unpackaged WinUI 3 loads its XAML through MRT Core: the PRI index and the compiled XAML must be in the package.
      - name: check the XAML resources
        if: ${{ !cancelled() }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'eid-token-test'
          Write-Host 'build output (*.pri, *.xbf):'
          Get-ChildItem src\EidTokenTest.App\bin -Recurse -Include *.pri, *.xbf | ForEach-Object { $_.FullName } | Out-Host
          Write-Host 'package (*.pri, *.xbf):'
          Get-ChildItem $out -Recurse -Include *.pri, *.xbf | ForEach-Object { $_.FullName.Substring($out.Length + 1) } | Out-Host
          foreach ($f in 'resources.pri', 'App.xbf', 'MainWindow.xbf') {
            if (-not (Test-Path (Join-Path $out $f))) { throw "missing in package: $f (the unpackaged app cannot load its XAML)" }
          }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-windows
          path: ${{ runner.temp }}/ui-smoke-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: zip
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          $zip = Join-Path $env:RUNNER_TEMP 'eid-token-test-windows-x64.zip'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'eid-token-test') (Join-Path $stage 'eid-token-test-windows-x64') -Recurse
          Compress-Archive -Path (Join-Path $stage 'eid-token-test-windows-x64') -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eid-token-test-windows-x64
          path: ${{ runner.temp }}/eid-token-test-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
