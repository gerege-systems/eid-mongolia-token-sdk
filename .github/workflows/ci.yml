# ci — every pull request:
#
#   changelog — the PR adds a changelog.d/<YYYY-MM-DD>-<topic>.md fragment and does not touch CHANGELOG.md
#               (CHANGELOG.md is assembled on main only; concurrent PRs would conflict on it)
#   gate      — the single summary check (skipped jobs pass, failed / cancelled ones do not)
#
# The platform builds and tests run in token-sdk-macos.yml and token-sdk-windows.yml.
#
# Runner for these light jobs: `vars.EID_LIGHT_RUNNER` (JSON); unset → GitHub-hosted "ubuntu-24.04".
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The PR's merge commit is compared with the target branch tip (HEAD^1).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.EID_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - shell: bash
        run: |
          set -eu
          base="$(git rev-parse --verify 'HEAD^1^{commit}')"
          if ! git diff --quiet "$base" HEAD -- CHANGELOG.md; then
            echo "CHANGELOG.md is assembled on main only - add a changelog.d/ fragment instead." >&2
            exit 1
          fi
          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- changelog.d/ | grep '\.md$' | grep -v '^changelog\.d/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "No changelog fragment: add changelog.d/<YYYY-MM-DD>-<topic>.md (see changelog.d/README.md)." >&2
            exit 1
          fi
          echo "$added"

  gate:
    if: always()
    needs: [changelog]
    runs-on: ${{ fromJSON(vars.EID_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled - see the jobs above." >&2
          exit 1
      - run: echo "gate OK"
