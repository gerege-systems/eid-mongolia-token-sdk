# ci — every pull request, one workflow run:
#
#   changelog — the PR adds a changelog.d/<YYYY-MM-DD>-<topic>.md fragment and does not touch CHANGELOG.md
#               (CHANGELOG.md is assembled on main only; concurrent PRs would conflict on it)
#   macos     — token-sdk-macos.yml (unit tests, app, eid-token-check, zip); runs only when vars.EID_MACOS_RUNNER is set
#   windows   — token-sdk-windows.yml (unit tests, app, eid-token-check.exe, zip)
#   verifier-linux — the .NET unit tests (verifier, reader policies, command-line tool) on Linux (GitHub-hosted
#               ubuntu-24.04): the C# verifier is the one recommended for servers, so it is tested where servers run
#   gate      — the single required check. It needs all four and passes ONLY when each of them succeeded:
#               a failed, cancelled or SKIPPED platform job (e.g. EID_MACOS_RUNNER unset) fails the gate. The platform
#               jobs are not path-filtered, so "not triggered" cannot happen; on workflow_dispatch (no PR) the changelog
#               job is skipped by design and that one skip is accepted.
#
# Runner for the light jobs: `vars.EID_LIGHT_RUNNER` (JSON); unset → GitHub-hosted "ubuntu-24.04".
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The PR's merge commit is compared with the target branch tip (HEAD^1).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.EID_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - shell: bash
        run: |
          set -eu
          base="$(git rev-parse --verify 'HEAD^1^{commit}')"
          if ! git diff --quiet "$base" HEAD -- CHANGELOG.md; then
            echo "CHANGELOG.md is assembled on main only - add a changelog.d/ fragment instead." >&2
            exit 1
          fi
          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- changelog.d/ | grep '\.md$' | grep -v '^changelog\.d/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "No changelog fragment: add changelog.d/<YYYY-MM-DD>-<topic>.md (see changelog.d/README.md)." >&2
            exit 1
          fi
          echo "$added"

  macos:
    if: vars.EID_MACOS_RUNNER != ''
    uses: ./.github/workflows/token-sdk-macos.yml

  windows:
    uses: ./.github/workflows/token-sdk-windows.yml

  verifier-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: unit tests (Linux)
        shell: bash
        working-directory: windows
        run: dotnet test tests/EidTokenTest.Tests/EidTokenTest.Tests.csproj -c Release --logger "console;verbosity=normal"

  gate:
    if: always()
    needs: [changelog, macos, windows, verifier-linux]
    runs-on: ${{ fromJSON(vars.EID_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CHANGELOG: ${{ needs.changelog.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.verifier-linux.result }}
        run: |
          set -u
          echo "changelog=$CHANGELOG macos=$MACOS windows=$WINDOWS verifier-linux=$LINUX (event $EVENT)"
          ok=true
          if [ "$CHANGELOG" != success ] && ! { [ "$EVENT" != pull_request ] && [ "$CHANGELOG" = skipped ]; }; then
            echo "::error::changelog: $CHANGELOG"; ok=false
          fi
          [ "$MACOS" = success ] || { echo "::error::macos: $MACOS (skipped = runner variable EID_MACOS_RUNNER unset)"; ok=false; }
          [ "$WINDOWS" = success ] || { echo "::error::windows: $WINDOWS"; ok=false; }
          [ "$LINUX" = success ] || { echo "::error::verifier-linux: $LINUX"; ok=false; }
          $ok
          echo "gate OK"
